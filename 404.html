<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Page Not Found | Muse by Anahita</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <script>
      // GitHub Pages SPA redirect: preserve the deep-link path and hand it
      // back to index.html so the client-side router can render the page.
      (function () {
        var l = window.location;
        var repoSegments = 0; // set to 1 if deploying to a PROJECT page (user.github.io/repo)
        var pathSegmentsToKeep = repoSegments;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body style="margin:0;min-height:100vh;background:#1a0a0d;color:#F6F3EB;font-family:Georgia,serif;display:flex;align-items:center;justify-content:center;text-align:center">
    <!-- shown only for a moment (or to visitors without JavaScript) before the
         redirect above hands the path to the site's own router -->
    <main style="padding:24px">
      <p style="font:600 12px sans-serif;letter-spacing:.35em;text-transform:uppercase;color:#D4567D">Muse by Anahita</p>
      <h1 style="font-style:italic;font-weight:400;font-size:34px;margin:12px 0">Page Not Found</h1>
      <p style="font:300 14px sans-serif;color:rgba(246,243,235,.75)">The page you were looking for doesn't exist or has moved.</p>
      <nav style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px;font:600 12px sans-serif;letter-spacing:.2em;text-transform:uppercase">
        <a href="/" style="color:#DCC3AA;padding:14px 18px">Home</a>
        <a href="/services" style="color:#DCC3AA;padding:14px 18px">Services</a>
        <a href="/bridal" style="color:#DCC3AA;padding:14px 18px">Bridal</a>
        <a href="/booking" style="color:#FAF9F6;background:#810B38;border-radius:999px;padding:14px 22px">Book Now</a>
      </nav>
    </main>
  </body>
</html>
